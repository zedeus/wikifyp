name: server

on:
  push:
    paths:
      - "server/**"
      - "fixtures/**"
      - ".github/workflows/ci.yml"

# A newer push to the same ref supersedes the running build.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          # Caching defaults to go.sum at the repo root, which doesn't exist;
          # without this the setup step fails on a missing dependencies file.
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to run on:" "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
