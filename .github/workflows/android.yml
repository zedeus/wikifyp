name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# A newer push to the same ref supersedes the running build; don't keep
# paying for the emulator job on commits nobody will look at.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Lets the action persist Gradle's configuration cache between runs.
          # Unset/empty just skips that cache. Create the secret with:
          #   gh secret set GRADLE_ENCRYPTION_KEY --body "$(openssl rand -base64 16)"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Robolectric downloads its android-all runtime jars into ~/.m2 at test
      # time; setup-gradle doesn't cover that directory.
      - name: cache robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
          # Any version-catalog edit changes the key; restore the previous
          # jars so only the delta downloads.
          restore-keys: robolectric-
      - name: check
        run: ./gradlew check
      # Verify-failure images (*_compare.png, *_actual.png) go to
      # build/outputs/roborazzi regardless of the goldens outputDir
      # (verified empirically: deliberate golden mismatch wrote them there).
      - name: upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore

  android-emulator:
    runs-on: ubuntu-latest
    # Emulator minutes are the expensive part; only spend them on commits
    # that already passed the fast JVM checks.
    needs: android
    # A wedged emulator otherwise idles until GitHub's 6-hour default.
    timeout-minutes: 45
    env:
      # The one definition of the emulator image; both runner steps and the
      # AVD cache key derive from it, so they cannot drift apart.
      API_LEVEL: 36
      # API 36 system images only exist in google_apis flavors.
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # GitHub-hosted Linux runners ship KVM but gate /dev/kvm behind root.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Creating the AVD and cold-booting it is the slow part (minutes per
      # run). Cache the AVD plus a boot snapshot and reuse them; the real
      # test run then boots from the snapshot.
      - name: cache AVD and boot snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}
      - name: create AVD and generate boot snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          # No -no-snapshot here: this run exists to save the boot snapshot.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          # Boot from the cached snapshot, never overwrite it.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - name: upload instrumented test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
